name: calendar_notes
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  table_calendar: ^3.2.0
  flutter_quill: ^11.4.0
  url_launcher: ^6.3.3
  firebase_auth: ^6.7.1
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # оформления (картинки и кот у каждого свои)
    - assets/images/themes/violet/
    - assets/images/themes/aurora/
    - assets/images/themes/mars/
    - assets/images/themes/blue/
    - assets/images/themes/nebula/
    - assets/images/themes/graphite/
