<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="calendar_notes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicons/violet.png"/>
  <meta name="theme-color" content="#0E0D13">

  <!--
    Оформление (lib/skins.dart, kSkins): цвет фона страницы, цвет вкладки и
    значок — ещё до загрузки Flutter, чтобы не мелькали чужие цвета.
    Таблица цветов сверяется с Dart-таблицей тестом (test/skins_test.dart).
  -->
  <script>
    (function () {
      var SKIN_BACKGROUNDS = {"violet": "#0E0D13", "aurora": "#091112", "mars": "#130D0B", "blue": "#080C15", "nebula": "#120A11", "graphite": "#0E0E0F"};
      var id = 'violet';
      try {
        var saved = window.localStorage.getItem('calendar_skin');
        if (saved && Object.prototype.hasOwnProperty.call(SKIN_BACKGROUNDS, saved)) id = saved;
      } catch (e) {}
      var bg = SKIN_BACKGROUNDS[id];
      var style = document.createElement('style');
      style.textContent = 'html, body { background-color: ' + bg + '; }';
      document.head.appendChild(style);
      var icon = document.querySelector('link[rel="icon"]');
      if (icon) icon.setAttribute('href', 'favicons/' + id + '.png');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', bg);
    })();
  </script>

  <title>calendar_notes</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
